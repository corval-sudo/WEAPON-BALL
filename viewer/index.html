<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>viewer</title>
  </head>
    <body>
    <div id="hud">
      <button id="playPause">Pause</button>

      <label>
        Speed:
        <select id="speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
      </label>

      <span id="tickReadout">tick: 0</span>

      <div id="batchControls">
        <label>
          Matches:
          <input id="batchCount" type="number" min="1" max="1000" value="10" />
        </label>
        <button id="runBatch">Run Batch</button>
      </div>

      <button id="adminToggle" class="admin-btn">Admin</button>
    </div>

    <!-- Admin panel (hidden by default) -->
    <div id="adminPanel" class="admin-panel hidden">
      <div class="admin-header">
        <div class="admin-tabs">
          <button class="admin-tab active" data-tab="skins">Skins</button>
          <button class="admin-tab" data-tab="weapons">Weapons</button>
          <button class="admin-tab" data-tab="fighters">Fighters</button>
        </div>
        <button id="adminClose" class="admin-close">&times;</button>
      </div>

      <!-- Skins tab -->
      <div class="admin-tab-content active" id="tab-skins">
        <div class="admin-body">
          <label>Ball A PNG <input id="ballAImg" type="file" accept="image/png" /></label>
          <label>Ball B PNG <input id="ballBImg" type="file" accept="image/png" /></label>
          <label>Weapon A PNG <input id="weaponAImg" type="file" accept="image/png" /></label>
          <label>Weapon B PNG <input id="weaponBImg" type="file" accept="image/png" /></label>
        </div>
      </div>

      <!-- Weapons tab -->
      <div class="admin-tab-content" id="tab-weapons">
        <div class="weapon-editor-layout">
          <div class="weapon-editor-list">
            <div class="weapon-list-header">
              <select id="weaponSelect"></select>
              <button id="weaponNew" class="btn-small">+ New</button>
              <button id="weaponDelete" class="btn-small btn-danger">Delete</button>
            </div>
            <div class="weapon-fields" id="weaponFields">
              <label>Name <input type="text" id="wf-name" /></label>
              <label>Type
                <select id="wf-type">
                  <option value="blade">blade</option>
                  <option value="point">point</option>
                  <option value="blunt">blunt</option>
                </select>
              </label>
              <label>Reach <input type="number" id="wf-reach" min="10" max="300" step="1" /></label>
              <label>Tip Radius <input type="number" id="wf-tipRadius" min="5" max="100" step="1" /></label>
              <label>Omega (spin) <input type="number" id="wf-omega" min="0" max="10000" step="100" /></label>
              <label>Base Damage <input type="number" id="wf-baseDamage" min="1" max="200" step="1" /></label>
              <label>Ramp/hit <input type="number" id="wf-ramp" min="0" max="50" step="1" /></label>
              <label>Speed Mult <input type="number" id="wf-speedMult" min="100" max="2000" step="10" /><span class="field-hint">1000 = 1.0x</span></label>
              <label>Weight <input type="number" id="wf-weight" min="100" max="3000" step="50" /><span class="field-hint">1000 = normal</span></label>
              <label class="blade-field">Blade Start <input type="number" id="wf-bladeStart" min="0" max="300" step="1" /><span class="field-hint">blade only</span></label>
              <label class="blade-field">Blade Width <input type="number" id="wf-bladeWidth" min="1" max="100" step="1" /><span class="field-hint">capsule half-w</span></label>
              <label>Shaft Radius <input type="number" id="wf-shaftRadius" min="1" max="50" step="1" /><span class="field-hint">deflect hitbox</span></label>
            </div>
            <button id="weaponSave" class="btn-primary">Apply Changes</button>
          </div>
          <div class="weapon-preview-area">
            <div class="preview-label">Hitbox Preview</div>
            <canvas id="weaponPreview" width="200" height="200"></canvas>
            <div class="preview-hint" id="previewHint">reach + tipRadius overlay</div>
          </div>
        </div>
      </div>

      <!-- Fighters tab -->
      <div class="admin-tab-content" id="tab-fighters">
        <div class="fighter-editor">
          <fieldset class="fighter-fieldset">
            <legend class="fighter-legend-a">Fighter A</legend>
            <label>HP <input type="number" id="ff-a-hp" min="1" max="10000" step="10" /></label>
            <label>Radius <input type="number" id="ff-a-radius" min="10" max="200" step="1" /></label>
            <label>Weapon <select id="ff-a-weapon"></select></label>
            <label>Pos X <input type="number" id="ff-a-posX" min="0" max="1000" step="1" /></label>
            <label>Pos Y <input type="number" id="ff-a-posY" min="0" max="1000" step="1" /></label>
            <label>Vel X <input type="number" id="ff-a-velX" min="-500" max="500" step="1" /></label>
            <label>Vel Y <input type="number" id="ff-a-velY" min="-500" max="500" step="1" /></label>
            <label>Restitution <input type="number" id="ff-a-restitution" min="0" max="2000" step="10" /><span class="field-hint">1000 = 1.0</span></label>
          </fieldset>
          <fieldset class="fighter-fieldset">
            <legend class="fighter-legend-b">Fighter B</legend>
            <label>HP <input type="number" id="ff-b-hp" min="1" max="10000" step="10" /></label>
            <label>Radius <input type="number" id="ff-b-radius" min="10" max="200" step="1" /></label>
            <label>Weapon <select id="ff-b-weapon"></select></label>
            <label>Pos X <input type="number" id="ff-b-posX" min="0" max="1000" step="1" /></label>
            <label>Pos Y <input type="number" id="ff-b-posY" min="0" max="1000" step="1" /></label>
            <label>Vel X <input type="number" id="ff-b-velX" min="-500" max="500" step="1" /></label>
            <label>Vel Y <input type="number" id="ff-b-velY" min="-500" max="500" step="1" /></label>
            <label>Restitution <input type="number" id="ff-b-restitution" min="0" max="2000" step="10" /><span class="field-hint">1000 = 1.0</span></label>
          </fieldset>
        </div>
        <button id="fighterSave" class="btn-primary">Apply Changes</button>
      </div>
    </div>

    <div id="main-container">
      <div id="eventLog"></div>
      <div id="arena-wrapper">
        <canvas id="arena"></canvas>
        <div id="matchBanner" class="hidden">
          <div id="matchBannerText"></div>
          <div id="matchBannerCountdown"></div>
        </div>
      </div>

      <div id="hp-panel">
        <div class="hp-tracker" id="hp-tracker-a">
          <div class="hp-label">Fighter A</div>
          <div class="hp-bar-container">
            <div class="hp-bar hp-bar-a" id="hp-bar-a"></div>
          </div>
          <div class="hp-text" id="hp-text-a">1000 / 1000</div>
          <div class="hp-stats" id="hp-stats-a"></div>
        </div>

        <div class="hp-tracker" id="hp-tracker-b">
          <div class="hp-label">Fighter B</div>
          <div class="hp-bar-container">
            <div class="hp-bar hp-bar-b" id="hp-bar-b"></div>
          </div>
          <div class="hp-text" id="hp-text-b">1000 / 1000</div>
          <div class="hp-stats" id="hp-stats-b"></div>
        </div>
      </div>
    </div>
    <!-- Batch match log -->
    <div id="batchPanel" class="hidden">
      <div id="batchSummary"></div>
      <div id="batchLog"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
