<?xml version="1.0" encoding="utf-8"?>
<!-- WORBZ brand sprite — Mace (blunt · heavy)
     White stroke/fill on transparent. Use Phaser setTint() for color.
     viewBox 0 0 100 100 · pointing right (0°) · Phaser rotates
     Head spikes mirror the GPS Globe mark's 8-point compass rose. -->
<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Butt cap -->
  <circle cx="7" cy="50" r="3" stroke="white" stroke-width="1.5"/>
  <!-- Shaft -->
  <line x1="10" y1="50" x2="54" y2="50" stroke="white" stroke-width="2.5"/>
  <!-- Grip wraps -->
  <line x1="14" y1="46" x2="14" y2="54" stroke="white" stroke-width="1"/>
  <line x1="20" y1="46" x2="20" y2="54" stroke="white" stroke-width="1"/>
  <line x1="26" y1="46" x2="26" y2="54" stroke="white" stroke-width="1"/>
  <!-- Head (circle) -->
  <circle cx="72" cy="50" r="16" stroke="white" stroke-width="2"/>
  <!-- Head center dot -->
  <circle cx="72" cy="50" r="3.5" fill="white" opacity="0.7"/>
  <!-- 8-point compass spikes — echoes brand mark -->
  <line x1="88" y1="50" x2="100" y2="50" stroke="white" stroke-width="2.2"/>
  <line x1="83" y1="39" x2="89" y2="33" stroke="white" stroke-width="1.8"/>
  <line x1="72" y1="34" x2="72" y2="25" stroke="white" stroke-width="2.2"/>
  <line x1="61" y1="39" x2="55" y2="33" stroke="white" stroke-width="1.8"/>
  <line x1="56" y1="50" x2="47" y2="50" stroke="white" stroke-width="2.2"/>
  <line x1="61" y1="61" x2="55" y2="67" stroke="white" stroke-width="1.8"/>
  <line x1="72" y1="66" x2="72" y2="75" stroke="white" stroke-width="2.2"/>
  <line x1="83" y1="61" x2="89" y2="67" stroke="white" stroke-width="1.8"/>
</svg>
