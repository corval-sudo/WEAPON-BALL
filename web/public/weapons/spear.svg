<?xml version="1.0" encoding="utf-8"?>
<!-- WORBZ brand sprite — Spear (point · reach)
     White stroke/fill on transparent. Use Phaser setTint() for color.
     viewBox 0 0 100 100 · pointing right (0°) · Phaser rotates -->
<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Butt cap -->
  <circle cx="5" cy="50" r="2.5" fill="white"/>
  <!-- Shaft -->
  <line x1="7" y1="50" x2="62" y2="50" stroke="white" stroke-width="2.2"/>
  <!-- Grip wraps -->
  <line x1="11" y1="46" x2="11" y2="54" stroke="white" stroke-width="1"/>
  <line x1="16" y1="46" x2="16" y2="54" stroke="white" stroke-width="1"/>
  <!-- Socket ferrule (head collar) -->
  <rect x="59" y="46.5" width="8" height="7" rx="1" stroke="white" stroke-width="1.2"/>
  <!-- Spearhead edges (converging to tip — extends to viewBox edge for hitbox alignment) -->
  <line x1="67" y1="41" x2="100" y2="50" stroke="white" stroke-width="1.8"/>
  <line x1="67" y1="59" x2="100" y2="50" stroke="white" stroke-width="1.8"/>
  <!-- Spearhead base cross-bar -->
  <line x1="67" y1="41" x2="67" y2="59" stroke="white" stroke-width="1.2"/>
  <!-- Tip -->
  <circle cx="100" cy="50" r="1.2" fill="white"/>
</svg>
