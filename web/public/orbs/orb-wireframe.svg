<?xml version="1.0" encoding="utf-8"?>
<!-- WORBZ brand sprite — CRT Wireframe Ball
     White stroke/fill on transparent. Use Phaser setTint() for color.
     viewBox 0 0 100 100 · pointing: n/a (globe, no orientation) -->
<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer sphere -->
  <circle cx="50" cy="50" r="46" stroke="white" stroke-width="2"/>
  <!-- Latitude lines (upper + lower) -->
  <ellipse cx="50" cy="34" rx="34" ry="9.5" stroke="white" stroke-width="1" opacity="0.6"/>
  <ellipse cx="50" cy="66" rx="34" ry="9.5" stroke="white" stroke-width="1" opacity="0.6"/>
  <!-- Prime meridian (vertical ellipse) -->
  <ellipse cx="50" cy="50" rx="14" ry="46" stroke="white" stroke-width="1.3"/>
  <!-- Equatorial ring — thicker, matches brand mark hierarchy -->
  <ellipse cx="50" cy="50" rx="46" ry="14" stroke="white" stroke-width="2.2"/>
  <!-- 8-point compass ticks (cardinal + diagonal) -->
  <line x1="96" y1="50" x2="89" y2="50" stroke="white" stroke-width="2"/>
  <line x1="83" y1="83" x2="78" y2="78" stroke="white" stroke-width="1.5"/>
  <line x1="50" y1="96" x2="50" y2="89" stroke="white" stroke-width="2"/>
  <line x1="17" y1="83" x2="22" y2="78" stroke="white" stroke-width="1.5"/>
  <line x1="4"  y1="50" x2="11" y2="50" stroke="white" stroke-width="2"/>
  <line x1="17" y1="17" x2="22" y2="22" stroke="white" stroke-width="1.5"/>
  <line x1="50" y1="4"  x2="50" y2="11" stroke="white" stroke-width="2"/>
  <line x1="83" y1="17" x2="78" y2="22" stroke="white" stroke-width="1.5"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3.5" fill="white"/>
</svg>
